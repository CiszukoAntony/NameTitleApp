name: Publish to PyPI

on:
  release:
    types: [published]  # Se dispara automáticamente cuando creas un Release en GitHub

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    # ⚠️ IMPORTANTE: Este permiso es obligatorio para que OIDC (Trusted Publishing) funcione
    permissions:
      id-token: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          
      - name: Build package with Poetry
        run: poetry build
        
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No necesitas pasar tokens ni contraseñas, GitHub y PyPI se comunican solos de forma segura.